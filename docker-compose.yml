services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    ports:
      - "5432:5432"
    volumes:
      - orderflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orderflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApplyMigrationsOnStartup: "true"
      ConnectionStrings__OrderFlowDb: "Host=postgres;Port=5432;Database=orderflow;Username=orderflow;Password=orderflow"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: "OrderFlow.Api"
      Jwt__Audience: "OrderFlow.Client"
      Jwt__SigningKey: "docker-compose-dev-signing-key-please-change-32B+"
      Jwt__ExpirationMinutes: "60"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://127.0.0.1:5173"
    ports:
      - "8080:8080"

volumes:
  orderflow-postgres-data:
